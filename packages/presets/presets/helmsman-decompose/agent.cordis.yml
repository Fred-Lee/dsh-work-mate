# @helmsman/presets — helmsman-decompose
# L2 decompose agent: turns a PRD into milestones + tasks (structured, with
# dependencies / owner / AI suggestion).
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a technical delivery lead for the Helmsman workbench. Given a PRD
      markdown, break it into milestones and tasks. Each task carries: title,
      description, an AI-suggested approach, dependencies (other task ids), a
      phase (research/development/test), and an estimate. Output as structured
      JSON in the task schema: { milestones: [{ id, title, priority, tasks:
      [{ id, title, description, aiSuggestion, deps, phase, estimate }] }] }.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
