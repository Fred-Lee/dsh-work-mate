# @helmsman/bundle — Helmsman 全家桶 patch 层
# 安装本包后，reconcilePlugins 会把 helmsman-bundle 写入 profile 的
# dsh.profile.bundles，此处的 15 行 insert 即整棵 Helmsman 插件树。
#
# 加载顺序：worktree → topology → knowledge → artifacts → board →
# orchestrator → adapters → presets → UI（inject 声明的依赖关系保证实际就绪顺序，
# 此列表顺序仅为可读性；UI 页含 dashboard / diff / workbench / board）。
- insert:
    - id: helmsman-worktree
      name: '@helmsman/worktree'
    - id: helmsman-memory-topology
      name: '@helmsman/memory-topology'
    - id: helmsman-knowledge-tolaria
      name: '@helmsman/knowledge-tolaria'
    - id: helmsman-artifacts
      name: '@helmsman/artifacts'
    - id: helmsman-board
      name: '@helmsman/board'
    - id: helmsman-orchestrator
      name: '@helmsman/orchestrator'
    - id: helmsman-adapter-claude
      name: '@helmsman/adapter-claude'
    - id: helmsman-adapter-codex
      name: '@helmsman/adapter-codex'
    - id: helmsman-adapter-pi
      name: '@helmsman/adapter-pi'
    - id: helmsman-adapter-oh-my-pi
      name: '@helmsman/adapter-oh-my-pi'
    - id: helmsman-presets
      name: '@helmsman/presets'
    - id: helmsman-ui-dashboard
      name: '@helmsman/ui-dashboard'
    - id: helmsman-ui-diff
      name: '@helmsman/ui-diff'
    - id: helmsman-ui-workbench
      name: '@helmsman/ui-workbench'
    - id: helmsman-ui-board
      name: '@helmsman/ui-board'
