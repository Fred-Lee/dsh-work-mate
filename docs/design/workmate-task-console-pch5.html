<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1014" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WorkMate · 任务运行台（原型 v2）</title>
<style>
  /* ============================================================
     WorkMate 原型 v2 · PC / H5 两套布局

     PC（≥900px）—— 桌面工作台
       · 左侧导航栏常驻；顶部是标题 + 汇总 + 操作
       · 「需要你」提成横贯的一条带，页内直接回答/验收
       · 待办 / 执行中 / 已完成 三列并排，一屏看全
       · 点卡片开右侧抽屉（与列表并排，不遮挡）

     H5（<900px）—— 手机远程
       · 没有左栏：底部 4 个 tab
       · 顶部 sticky 只有两件事：连没连上、要不要我
       · 「需要你」置顶，回答框直接可点（44px 触控目标）
       · 待办/执行中/已完成 变成分段切换，不再横向挤压
       · 详情是底部抽屉（88vh），新建是全屏 sheet
       · 输入框 16px 避免 iOS 自动放大；留 safe-area 内边距

     字段与实现对齐：全部来自 GET /api/tasks 的 TaskCardView
       task.{id,title,intent,repo,baseBranch,priority,attempt,createdBy,
             proposalId,createdAt,updatedAt}
       lane / substate / note / ticket.{id,stage,action,ended,directory}
       health.{online,reason,paused} / attention / notes
     ============================================================ */

  :root {
    color-scheme: light;
    --bg: #f3f4f6;
    --surface: #ffffff;
    --surface-2: #fafbfc;
    --surface-3: #f0f2f5;
    --ink: #14161b;
    --ink-2: #3a3f47;
    --muted: #6a7180;
    --muted-2: #949ba6;
    --line: #e1e4e9;
    --line-soft: #eceef2;

    --working: #3d6ed0;
    --working-soft: #eef3fd;
    --working-line: #d7e3f9;
    --attention: #a8690a;
    --attention-soft: #fdf5e6;
    --attention-line: #f0dcb4;
    --done: #2c7850;
    --done-soft: #ecf5ef;
    --done-line: #d5e9de;
    --danger: #a9433b;
    --danger-soft: #fdeeed;
    --danger-line: #f1d3cf;

    --radius: 12px;
    --radius-sm: 8px;
    --shadow-1: 0 0.5px 1px rgba(16, 20, 30, .04), 0 1px 2px rgba(16, 20, 30, .05);
    --shadow-2: 0 6px 16px rgba(16, 20, 30, .09);
    --shadow-3: 0 22px 52px rgba(16, 20, 30, .20);

    --rail-w: 212px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }

  body[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1014;
    --surface: #171a1f;
    --surface-2: #1c1f25;
    --surface-3: #23272e;
    --ink: #e9ebef;
    --ink-2: #c4c9d1;
    --muted: #8b929c;
    --muted-2: #666d78;
    --line: #2b3038;
    --line-soft: #23272e;

    --working: #7aa2ef;
    --working-soft: #1a2437;
    --working-line: #27364f;
    --attention: #e3a851;
    --attention-soft: #2b2316;
    --attention-line: #584422;
    --done: #63bd90;
    --done-soft: #16241c;
    --done-line: #234031;
    --danger: #e28278;
    --danger-soft: #2b1b19;
    --danger-line: #4a2925;

    --shadow-1: 0 1px 2px rgba(0, 0, 0, .55);
    --shadow-2: 0 8px 22px rgba(0, 0, 0, .5);
    --shadow-3: 0 24px 56px rgba(0, 0, 0, .66);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 13px/1.55 var(--font);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  code, .mono { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* 两套壳：默认按屏幕宽度选；body[data-device] 可强制预览另一套 */
  .shell-pc, .shell-h5 { display: none; }
  body:not([data-device]) .shell-pc { display: flex; }
  body[data-device="pc"] .shell-pc { display: flex; }
  body[data-device="h5"] .shell-h5 { display: flex; }
  @media (max-width: 899px) {
    body:not([data-device]) .shell-pc { display: none; }
    body:not([data-device]) .shell-h5 { display: flex; }
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 30px; padding: 0 11px; border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--ink-2); font-size: 12px; white-space: nowrap;
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn:hover { background: var(--surface-3); color: var(--ink); }
  .btn:active { transform: translateY(.5px); }
  .btn:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }
  .btn-primary { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 560; }
  .btn-primary:hover { background: #2b2e35; border-color: #2b2e35; color: #fff; }
  body[data-theme="dark"] .btn-primary { background: #e9ebef; border-color: #e9ebef; color: #14171c; }
  body[data-theme="dark"] .btn-primary:hover { background: #fff; border-color: #fff; color: #14171c; }
  .btn-sm { height: 26px; padding: 0 9px; font-size: 11.5px; }
  .btn-quiet { border-color: transparent; background: transparent; color: var(--muted); }
  .btn-quiet:hover { background: var(--surface-3); color: var(--ink); }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { background: var(--danger-soft); border-color: var(--danger-line); color: var(--danger); }
  .btn[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: var(--surface-3); }

  .state {
    flex: none; display: inline-flex; align-items: center; gap: 5px; height: 19px; padding: 0 7px;
    border-radius: 999px; font-size: 10.5px; font-weight: 580; letter-spacing: .01em;
    border: 1px solid transparent; white-space: nowrap;
  }
  .state::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .state[data-tone="todo"] { color: var(--muted); background: var(--surface-3); border-color: var(--line-soft); }
  .state[data-tone="working"] { color: var(--working); background: var(--working-soft); border-color: var(--working-line); }
  .state[data-tone="attention"] { color: var(--attention); background: var(--attention-soft); border-color: var(--attention-line); }
  .state[data-tone="done"] { color: var(--done); background: var(--done-soft); border-color: var(--done-line); }
  .state[data-tone="danger"] { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-line); }
  .state[data-tone="working"]::before { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .state[data-tone="working"]::before { animation: none; } }

  .chip {
    display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px;
    border-radius: 5px; background: var(--surface-3); color: var(--muted);
    font-family: var(--mono); font-size: 10px; white-space: nowrap;
  }
  .chip-repo { background: transparent; border: 1px solid var(--line-soft); }
  .steps { display: inline-flex; align-items: center; gap: 3px; flex: none; }
  .steps i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
  .steps i.on { background: var(--ink-2); }
  .dot { color: var(--line); }

  /* ============================================================
     PC
     ============================================================ */
  .shell-pc { height: 100%; }

  .rail {
    width: var(--rail-w); flex: none; display: flex; flex-direction: column;
    background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 20px; }
  .brand-mark {
    width: 27px; height: 27px; border-radius: 8px; display: grid; place-items: center; flex: none;
    background: var(--ink); color: var(--surface); font-size: 10px; font-weight: 750; letter-spacing: .05em;
  }
  .brand-name { font-size: 13.5px; font-weight: 660; }
  .brand-sub { font-size: 10.5px; color: var(--muted-2); margin-top: 1px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 9px;
    border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent;
    color: var(--muted); font-size: 12.5px; text-align: left; transition: background .12s, color .12s;
  }
  .nav-item:hover { background: var(--surface-3); color: var(--ink-2); }
  .nav-item[aria-current="page"] { background: var(--surface-3); color: var(--ink); font-weight: 600; }
  .nav-icon { width: 15px; height: 15px; flex: none; opacity: .8; }
  .nav-count { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--muted-2); }
  .nav-badge {
    margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
    display: grid; place-items: center; font-family: var(--mono); font-size: 10px; font-weight: 640;
    background: var(--attention-soft); color: var(--attention); border: 1px solid var(--attention-line);
  }
  .nav-badge[hidden] { display: none; }
  .nav-spacer { flex: 1 1 auto; }
  .exec {
    display: flex; align-items: flex-start; gap: 8px; padding: 10px;
    border: 1px solid var(--line-soft); border-radius: var(--radius-sm); background: var(--surface-2);
  }
  .exec-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex: none; background: var(--done); }
  .exec[data-state="off"] .exec-dot { background: var(--danger); }
  .exec-main { min-width: 0; }
  .exec-title { font-size: 11.5px; font-weight: 620; }
  .exec-sub { font-family: var(--mono); font-size: 10px; color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail-tools { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
  .rail-tool { display: flex; align-items: center; gap: 7px; padding: 5px 9px; border: 0; border-radius: 6px; background: none; color: var(--muted-2); font-size: 10.5px; text-align: left; }
  .rail-tool:hover { background: var(--surface-3); color: var(--muted); }

  .pc-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }
  .pc-main > * { flex: none; }

  .pc-top { display: flex; align-items: flex-start; gap: 14px; padding: 18px 26px 13px; border-bottom: 1px solid var(--line-soft); }
  .pc-title { font-size: 17px; font-weight: 660; letter-spacing: -.006em; line-height: 1.25; }
  .pc-sub { margin-top: 3px; font-size: 11.5px; color: var(--muted); }
  .pc-sub b { color: var(--ink-2); font-weight: 620; }
  .pc-sub .sep { margin: 0 6px; color: var(--line); }
  .pc-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-top: 2px; }

  .offline-banner {
    display: none; align-items: center; gap: 9px; margin: 14px 26px 0; padding: 10px 14px;
    border: 1px solid var(--danger-line); border-radius: var(--radius); background: var(--danger-soft);
    color: var(--danger); font-size: 12px;
  }
  .offline-banner[data-on="true"] { display: flex; }
  .offline-banner b { font-weight: 650; }
  .offline-banner .btn { margin-left: auto; }

  .band { margin: 14px 26px 0; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--attention-line); background: var(--attention-soft); }
  .band[data-empty="true"] { border-style: dashed; border-color: var(--line); background: transparent; }
  .band-head { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--attention-line); }
  .band[data-empty="true"] .band-head { border-bottom: 0; }
  .band-icon { width: 15px; height: 15px; color: var(--attention); flex: none; }
  .band-title { font-size: 12px; font-weight: 660; color: var(--attention); }
  .band-count { font-family: var(--mono); font-size: 10.5px; color: var(--attention); opacity: .75; }
  .band-hint { margin-left: auto; font-size: 11px; color: var(--attention); opacity: .78; }
  .band[data-empty="true"] .band-title, .band[data-empty="true"] .band-hint { color: var(--muted); }
  .band[data-empty="true"] .band-icon { color: var(--muted-2); }
  .band-body { display: flex; flex-direction: column; }
  .band[data-empty="true"] .band-body { display: none; }
  .band-empty { display: none; padding: 0 14px 11px; font-size: 11.5px; color: var(--muted); }
  .band[data-empty="true"] .band-empty { display: block; }

  .band-item { display: flex; align-items: flex-start; gap: 14px; padding: 13px 14px; }
  .band-item + .band-item { border-top: 1px solid var(--attention-line); }
  .band-item-body { flex: 1 1 auto; min-width: 0; }
  .band-item-kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 5px; }
  .band-item-kind {
    display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 5px;
    background: var(--surface); border: 1px solid var(--attention-line); color: var(--attention); font-size: 10.5px; font-weight: 600;
  }
  .band-item-kicker .from { font-size: 11px; color: var(--muted); }
  .band-item-kicker .from b { color: var(--ink-2); font-weight: 600; }
  .band-item-q { margin: 0; font-size: 13px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .band-answer { display: flex; gap: 7px; margin-top: 9px; }
  .band-answer input {
    flex: 1 1 auto; min-width: 0; height: 31px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface);
  }
  .band-answer input:focus { outline: none; border-color: var(--attention); box-shadow: 0 0 0 3px var(--attention-soft); }
  .band-answer input::placeholder { color: var(--muted-2); }
  .band-item-side { flex: none; display: flex; flex-direction: column; gap: 6px; }

  .lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 18px 26px 8px; align-items: start; }
  .lane { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .lane-head { display: flex; align-items: center; gap: 7px; padding: 0 2px; }
  .lane-name { font-size: 12px; font-weight: 650; color: var(--ink-2); }
  .lane-count { min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px; display: grid; place-items: center; font-family: var(--mono); font-size: 10px; color: var(--muted); background: var(--surface-3); }
  .lane-hint { margin-left: auto; font-size: 10.5px; color: var(--muted-2); white-space: nowrap; }
  .lane-body { display: flex; flex-direction: column; gap: 9px; }
  .lane-empty { padding: 16px 12px; border: 1px dashed var(--line); border-radius: var(--radius); font-size: 11.5px; color: var(--muted-2); text-align: center; line-height: 1.7; }

  .card {
    position: relative; display: flex; flex-direction: column; border: 1px solid var(--line);
    border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-1); overflow: hidden;
    transition: border-color .12s, box-shadow .12s;
  }
  .card:hover { border-color: #cfd5dd; box-shadow: var(--shadow-2); }
  body[data-theme="dark"] .card:hover { border-color: #3a414d; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--line); }
  .card[data-tone="working"]::before { background: var(--working); }
  .card[data-tone="attention"]::before { background: var(--attention); }
  .card[data-tone="done"]::before { background: var(--done); }
  .card[data-tone="danger"]::before { background: var(--danger); }

  .card-open { display: block; width: 100%; text-align: left; padding: 12px 13px 0 16px; border: 0; background: none; color: inherit; }
  .card-open:focus-visible { outline: 2px solid var(--working); outline-offset: -2px; }
  .card-top { display: flex; align-items: flex-start; gap: 8px; }
  .card-title { flex: 1 1 auto; min-width: 0; margin: 0; font-size: 13.2px; font-weight: 620; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-intent { margin: 6px 0 0; font-size: 11.6px; line-height: 1.55; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-quote { margin: 8px 0 0; padding: 7px 10px; border-radius: 0 6px 6px 0; border-left: 2px solid var(--attention-line); background: var(--attention-soft); font-size: 11.6px; line-height: 1.5; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card-foot { display: flex; align-items: center; gap: 8px; padding: 10px 13px 11px 16px; }
  .card-meta { display: flex; flex-wrap: nowrap; align-items: center; gap: 5px; min-width: 0; flex: 1 1 auto; font-size: 10.5px; color: var(--muted-2); overflow: hidden; }
  .card-meta > * { flex: none; }
  /* 时间是最先可以让位的：窄列里宁可截断时间，也不要把按钮挤到第二行 */
  .card-meta > span:last-child { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-action { margin-left: auto; flex: none; }
  .card[data-tone="working"] .steps i.on { background: var(--working); }
  .card[data-tone="attention"] .steps i.on { background: var(--attention); }
  .card[data-tone="done"] .steps i.on { background: var(--done); }
  .card[data-tone="danger"] .steps i.on { background: var(--danger); }

  @media (max-width: 1180px) and (min-width: 900px) {
    .lanes { gap: 10px; padding-left: 20px; padding-right: 20px; }
    .card-open { padding: 11px 11px 0 14px; }
    .card-foot { padding: 9px 11px 10px 14px; }
    .card-meta .chip-repo { max-width: 74px; overflow: hidden; text-overflow: ellipsis; }
  }
  /* ---------- 活动视图（独立视图，支持快捷搜索） ---------- */
  .pc-view[hidden] { display: none; }
  .act-head { display: flex; align-items: flex-start; gap: 14px; padding: 18px 26px 12px; border-bottom: 1px solid var(--line-soft); }
  .act-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .search {
    display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--muted);
  }
  .search:focus-within { border-color: var(--working); box-shadow: 0 0 0 3px var(--working-soft); }
  .search input { width: 226px; border: 0; background: none; outline: none; font-size: 12.5px; color: var(--ink); }
  .search input::placeholder { color: var(--muted-2); }
  .search kbd {
    font-family: var(--mono); font-size: 9.5px; padding: 1px 5px; border-radius: 4px;
    border: 1px solid var(--line-soft); background: var(--surface-2); color: var(--muted-2);
  }
  .act-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 26px 0; }
  .chip-filter {
    height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--muted); font-size: 11.5px;
  }
  .chip-filter:hover { background: var(--surface-3); color: var(--ink-2); }
  .chip-filter[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 560; }
  body[data-theme="dark"] .chip-filter[aria-pressed="true"] { background: #e9ebef; border-color: #e9ebef; color: #14171c; }
  .act-list { padding: 10px 26px 26px; }
  .act-day { display: flex; align-items: center; gap: 9px; padding: 12px 0 6px; font-size: 11px; font-weight: 650; color: var(--muted-2); letter-spacing: .04em; }
  .act-day::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--line-soft); }
  .act-row {
    display: grid; grid-template-columns: 58px 14px minmax(0, 1fr) auto; gap: 10px; align-items: center;
    width: 100%; padding: 9px 10px; border: 0; border-radius: 9px; background: none; text-align: left;
  }
  .act-row:hover { background: var(--surface); box-shadow: var(--shadow-1); }
  .act-time { font-family: var(--mono); font-size: 10.5px; color: var(--muted-2); }
  .act-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); justify-self: center; }
  .act-dot[data-kind="question"] { background: var(--attention); }
  .act-dot[data-kind="review"] { background: var(--attention); }
  .act-dot[data-kind="answer"] { background: var(--working); }
  .act-dot[data-kind="dispatch"] { background: var(--working); }
  .act-dot[data-kind="accept"] { background: var(--working); }
  .act-dot[data-kind="end"] { background: var(--done); }
  .act-dot[data-kind="stop"] { background: var(--danger); }
  .act-main { min-width: 0; }
  .act-title { display: block; font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .act-sub { display: block; margin-top: 2px; font-size: 10.5px; color: var(--muted-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act-kind {
    flex: none; height: 19px; padding: 0 7px; border-radius: 5px; display: inline-flex; align-items: center;
    font-size: 10.5px; color: var(--muted); background: var(--surface-3); border: 1px solid var(--line-soft);
  }
  .act-empty { padding: 40px 16px; text-align: center; font-size: 12px; color: var(--muted-2); line-height: 1.9; }

  /* H5 的活动视图 */
  .h5-act-search { flex: none; display: flex; align-items: center; gap: 8px; margin: 0 0 4px; padding: 0 10px; height: 42px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }

  .h5-act-search input { flex: 1 1 auto; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; }

  .h5-act-chips { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 0 0 4px; scrollbar-width: none; }

  .h5-act-row { display: grid; grid-template-columns: 52px 10px minmax(0, 1fr); gap: 9px; align-items: center; width: 100%; padding: 12px 12px; border: 1px solid var(--line-soft); border-radius: 12px; background: var(--surface); text-align: left; }

  .h5-act-row .act-title { font-size: 13.5px; color: var(--ink); white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .h5-act-row .act-sub { font-size: 11.5px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .h5-act-day { display: flex; align-items: center; gap: 8px; padding: 12px 2px 8px; font-size: 11.5px; font-weight: 650; color: var(--muted-2); }
  .h5-act-day::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--line-soft); }

  /* ============================================================
     H5
     ============================================================ */
  .shell-h5 { flex-direction: column; height: 100%; background: var(--bg); }

  .h5-top {
    flex: none; position: sticky; top: 0; z-index: 20;

  }
  .h5-top-row { display: flex; align-items: center; gap: 10px; }

  .icon-btn {
    display: inline-grid; place-items: center; width: 36px; height: 36px; flex: none;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink-2);
  }
  .icon-btn:active { background: var(--surface-3); }

  .h5-segs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; margin-top: 10px; padding: 3px; background: var(--surface-3); border-radius: 11px; }
  .h5-seg {
    display: flex; align-items: center; justify-content: center; gap: 4px; height: 36px;

    overflow: hidden; white-space: nowrap;
  }
  .h5-seg[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
  .h5-seg-n { font-family: var(--mono); font-size: 10.5px; opacity: .75; }

  .h5-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 12px 16px calc(100px + env(safe-area-inset-bottom, 0px));

  }
  /* 同 PC 的教训：固定高度的 flex 列会压缩子项，卡片底部按钮被裁掉。 */
  .h5-body > * { flex: 0 0 auto; }

  .h5-card { position: relative; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow-1); overflow: hidden; }
  .h5-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--line); }
  .h5-card[data-tone="working"]::before { background: var(--working); }
  .h5-card[data-tone="attention"]::before { background: var(--attention); }

  .h5-card[data-tone="danger"]::before { background: var(--danger); }
  .h5-card-open { display: block; width: 100%; text-align: left; padding: 14px 14px 0 17px; border: 0; background: none; color: inherit; }
  .h5-card-open:active { background: var(--surface-2); }
  .h5-card-top { display: flex; align-items: flex-start; gap: 8px; }
  .h5-card-title { flex: 1 1 auto; min-width: 0; margin: 0; font-size: 15px; font-weight: 620; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .h5-card-intent { margin: 7px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .h5-card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 9px; font-size: 11px; color: var(--muted-2); }
  .h5-card-foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px 17px; }
  .h5-card-foot .btn { height: 40px; padding: 0 16px; font-size: 13px; border-radius: 10px; }
  .h5-card-foot .btn-primary { flex: 1 1 auto; }
  .h5-card-foot .btn:only-child { flex: 1 1 auto; }

  .h5-attention { display: flex; flex-direction: column; gap: 10px; }
  .h5-alert-card { border-color: var(--attention-line); background: var(--attention-soft); }
  .h5-alert-head { display: flex; align-items: center; gap: 7px; padding: 11px 14px 0; }
  .h5-alert-kind { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--attention-line); color: var(--attention); font-size: 11px; font-weight: 640; flex: none; }
  .h5-alert-src { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h5-alert-q { margin: 8px 14px 0; font-size: 14px; line-height: 1.55; color: var(--ink); }
  .h5-answer { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px; }
  .h5-answer textarea {
    width: 100%; min-height: 68px; padding: 10px 11px; resize: none; font-size: 16px; line-height: 1.5;
    border: 1px solid var(--attention-line); border-radius: 11px; background: var(--surface); color: var(--ink);
  }
  .h5-answer textarea:focus { outline: none; border-color: var(--attention); }
  .h5-answer textarea::placeholder { color: var(--muted-2); font-size: 14px; }
  .h5-answer .row { display: flex; gap: 8px; }
  .h5-answer .btn { height: 44px; font-size: 14.5px; border-radius: 11px; }
  .h5-answer .btn-primary { flex: 1 1 auto; }

  .h5-empty { padding: 26px 16px; text-align: center; font-size: 12.5px; color: var(--muted-2); line-height: 1.8; }
  .h5-section-note { padding: 2px 2px 0; font-size: 11.5px; color: var(--muted-2); display: flex; align-items: center; gap: 6px; }
  .link-btn { padding: 0; border: 0; background: none; color: var(--attention); font-size: 11.5px; text-decoration: underline; text-underline-offset: 2px; }

  .h5-tabs {
    flex: none; position: sticky; bottom: 0; z-index: 20;
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    padding: 6px 6px calc(env(safe-area-inset-bottom, 0px) + 6px);
    background: var(--surface); border-top: 1px solid var(--line);
  }
  .h5-tab {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 5px 0 2px; border: 0; background: none; color: var(--muted); font-size: 10.5px;
  }
  .h5-tab[aria-current="page"] { color: var(--ink); font-weight: 600; }
  .h5-tab svg { width: 21px; height: 21px; }
  .h5-tab .dot-badge {
    position: absolute; top: 0; right: calc(50% - 21px); min-width: 15px; height: 15px; padding: 0 4px;
    display: grid; place-items: center; border-radius: 999px; background: var(--attention); color: #fff;
    font-family: var(--mono); font-size: 9px; font-weight: 700;
  }
  .h5-tab .dot-badge[hidden] { display: none; }

  .h5-fab {
    position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); z-index: 25;
    width: 54px; height: 54px; border-radius: 17px; border: 0;
    display: grid; place-items: center; background: var(--ink); color: var(--surface); box-shadow: var(--shadow-2);
  }
  body[data-theme="dark"] .h5-fab { background: #e9ebef; color: #14171c; }
  .h5-fab:active { transform: scale(.96); }

  /* ============================================================
     抽屉：PC 右侧滑入，H5 底部上滑
     ============================================================ */
  .mask { position: fixed; inset: 0; background: rgba(9, 11, 15, .40); opacity: 0; pointer-events: none; transition: opacity .16s; z-index: 40; }
  .mask[data-open="true"] { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; right: 0; top: 0; bottom: 0; width: 458px; max-width: 100vw; z-index: 41;
    display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line);
    box-shadow: var(--shadow-3); transform: translateX(100%); transition: transform .24s cubic-bezier(.32, .72, 0, 1);
  }
  .drawer[data-open="true"] { transform: translateX(0); }
  @media (max-width: 899px) {
    .drawer {
      left: 0; right: 0; top: auto; width: auto; height: 90vh; max-height: 90vh;

      transform: translateY(100%); padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .drawer[data-open="true"] { transform: translateY(0); }
    .drawer::before {
      content: ""; position: absolute; top: 7px; left: 50%; transform: translateX(-50%);
      width: 36px; height: 4px; border-radius: 999px; background: var(--line);
    }
  }
  .drawer-head { position: relative; padding: 18px 20px 14px; border-bottom: 1px solid var(--line-soft); }
  @media (max-width: 899px) { .drawer-head { padding: 22px 18px 14px; } }
  .drawer-eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-bottom: 8px; font-size: 10.5px; color: var(--muted-2); }
  .drawer-title { margin: 0; padding-right: 30px; font-size: 16px; font-weight: 660; line-height: 1.45; }
  @media (max-width: 899px) { .drawer-title { font-size: 17px; } }
  .drawer-sub { margin-top: 6px; font-size: 11.5px; line-height: 1.6; color: var(--muted); }
  @media (max-width: 899px) { .drawer-sub { font-size: 13px; } }
  .drawer-close {
    position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center;
  }
  .drawer-close:hover { background: var(--surface-3); color: var(--ink); }
  .drawer-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 20px 26px; }
  @media (max-width: 899px) { .drawer-body { padding: 14px 18px 24px; } }
  .dsec { margin-bottom: 22px; }
  .dsec:last-child { margin-bottom: 0; }
  .dsec-title { display: flex; align-items: center; gap: 7px; margin: 0 0 10px; font-size: 10.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-2); }
  .dsec-title .from { text-transform: none; letter-spacing: 0; font-weight: 500; padding-left: 8px; border-left: 1px solid var(--line); }

  .track { display: flex; align-items: center; padding: 4px 0 0; }
  .track-step { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1 1 0; min-width: 0; }
  .track-dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); }
  .track-step[data-on="true"] .track-dot { border-color: var(--ink-2); background: var(--ink-2); }
  .track-step[data-current="true"] .track-dot { border-color: var(--working); background: var(--working); box-shadow: 0 0 0 3px var(--working-soft); }
  .track-label { font-size: 10px; color: var(--muted-2); text-align: center; white-space: nowrap; }
  .track-step[data-on="true"] .track-label { color: var(--ink-2); }
  .track-line { flex: 0 0 16px; height: 1.5px; background: var(--line); margin-bottom: 20px; }
  .track-step[data-on="true"] + .track-line { background: var(--ink-2); }

  .kv { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px 10px; margin: 0; font-size: 11.6px; }
  .kv dt { color: var(--muted-2); }
  .kv dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
  .kv dd.mono { font-size: 10.5px; }
  @media (max-width: 899px) { .kv { font-size: 13px; grid-template-columns: 64px minmax(0, 1fr); } }
  .empty-line { font-size: 11.6px; color: var(--muted-2); line-height: 1.65; }

  .notice { padding: 11px 12px; border-radius: 10px; background: var(--attention-soft); border: 1px solid var(--attention-line); }
  .notice b { font-size: 11.5px; color: var(--attention); font-weight: 650; }
  .notice p { margin: 5px 0 0; font-size: 12.5px; line-height: 1.62; color: var(--ink-2); }
  .answer-box { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .answer-box textarea {
    width: 100%; min-height: 74px; padding: 10px 11px; resize: vertical;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2);
    font-size: 13px; line-height: 1.55;
  }
  .answer-box textarea:focus { outline: none; border-color: var(--working); background: var(--surface); box-shadow: 0 0 0 3px var(--working-soft); }
  .answer-actions { display: flex; align-items: center; gap: 8px; }
  .answer-actions .hint { font-size: 10.5px; color: var(--muted-2); }
  @media (max-width: 899px) {
    .answer-box textarea { font-size: 16px; min-height: 84px; }
    .answer-actions { flex-wrap: wrap; }
    .answer-actions .hint { width: 100%; order: 3; }
    .answer-actions .btn { height: 44px; font-size: 14.5px; flex: 1 1 0; }
    .answer-actions .grow { display: none; }
  }
  .grow { flex: 1 1 auto; }

  .drawer-foot { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line-soft); background: var(--surface-2); }
  @media (max-width: 899px) {
    .drawer-foot { padding: 12px 16px; }
    .drawer-foot .btn { height: 44px; font-size: 14px; flex: 1 1 0; }
    .drawer-foot .grow { display: none; }
  }

  /* ============================================================
     新建：PC 居中弹窗，H5 全屏 sheet
     ============================================================ */
  .modal {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -46%) scale(.985);
    width: 524px; max-width: calc(100vw - 32px); max-height: calc(100vh - 48px);
    display: none; flex-direction: column; background: var(--surface); border-radius: 14px;
    box-shadow: var(--shadow-3); z-index: 52; opacity: 0; transition: opacity .16s, transform .18s;
  }
  .modal[data-open="true"] { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
  @media (max-width: 899px) {
    .modal {
      left: 0; right: 0; bottom: 0; top: auto; width: auto; max-width: none; max-height: none;
      height: 94vh; border-radius: 18px 18px 0 0;
      transform: translateY(100%); padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .modal[data-open="true"] { transform: translateY(0); }
    .modal::before {
      content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 36px; height: 4px; border-radius: 999px; background: var(--line);

  .modal-head { position: relative; display: flex; align-items: center; padding: 16px 18px 12px; border-bottom: 1px solid var(--line-soft); }
  @media (max-width: 899px) { .modal-head { padding: 22px 18px 12px; } }
  .modal-head h2 { margin: 0; font-size: 15px; font-weight: 660; }
  @media (max-width: 899px) { .modal-head h2 { font-size: 17px; } }
  .modal-head .btn { margin-left: auto; }
  .modal-body { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  .modal-foot { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line-soft); background: var(--surface-2); }
  @media (max-width: 899px) {
    .modal-foot .btn { height: 46px; font-size: 15px; }
    .modal-foot .btn-primary { flex: 1 1 auto; }
    .modal-foot .grow { display: none; }
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label { font-size: 11.5px; font-weight: 620; color: var(--ink-2); }
  .field > label small { font-weight: 400; color: var(--muted-2); margin-left: 6px; font-size: 10.5px; }
  .field textarea, .field input, .field select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--surface-2); font-size: 12.5px;
  }
  /* iOS：输入框字号 <16px 会自动放大页面 */
  @media (max-width: 899px) {
    .field textarea, .field input, .field select { font-size: 16px; padding: 11px 12px; }
    .field > label { font-size: 13px; }
  }
  .field textarea { min-height: 86px; resize: vertical; line-height: 1.6; }
  .field textarea:focus, .field input:focus, .field select:focus { outline: none; border-color: var(--working); background: var(--surface); box-shadow: 0 0 0 3px var(--working-soft); }
  .field-row { display: grid; grid-template-columns: 1.3fr 1fr 0.8fr; gap: 10px; }
  @media (max-width: 899px) { .field-row { grid-template-columns: minmax(0, 1fr); } }
  .modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 899px) { .modes { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
  .mode { display: flex; flex-direction: column; gap: 3px; padding: 9px 10px; text-align: left; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface); }
  .mode:hover { border-color: var(--line); background: var(--surface-2); }
  .mode[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .mode b { font-size: 11.6px; font-weight: 620; }
  .mode span { font-size: 10.5px; color: var(--muted); line-height: 1.45; }
  @media (max-width: 899px) {
    .mode { flex-direction: row; align-items: baseline; gap: 8px; padding: 12px; }
    .mode b { font-size: 14px; }
    .mode span { font-size: 12px; }
  }
</style>

        <span>活动</span>
      </button>
      <button class="nav-item" type="button">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2h7l3 3v9H3z"/><path d="M6 6.5h4M6 9.5h4M6 12.5h2.5"/></svg>
        <span>提案</span><span class="nav-count">11</span>
      </button>
      <button class="nav-item" type="button">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="3.5" r="2"/><circle cx="3.5" cy="12" r="2"/><circle cx="12.5" cy="12" r="2"/><path d="M8 5.5v2M8 7.5 3.5 10M8 7.5 12.5 10"/></svg>
        <span>团队</span>

  const esc = (text) => String(text ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

    <div class="card" data-tone="${task.tone}">

        <div class="card-top">
          <h3 class="card-title">${esc(task.title)}</h3>
          <span class="state" data-tone="${task.tone}">${esc(task.state)}</span>

  function pcBandItem(task) {
    const index = TASKS.indexOf(task);
    const answer = task.substate === 'answer';
    return `
    <div class="band-item">
      <div class="band-item-body">
        <div class="band-item-kicker">
          <span class="band-item-kind">${esc(task.kind)}</span>
          <span class="from">来自「<b>${esc(task.title)}</b>」· ${esc(task.repo)} · ${esc(task.updated)}</span>
        </div>
        <p class="band-item-q">${esc(task.note ?? task.intent)}</p>
        ${answer ? `
        <div class="band-answer">
          <label class="sr-only" for="pc-answer-${index}">回答</label>
          <input id="pc-answer-${index}" data-answer-input="${index}" placeholder="回答 worker 的提问，回车发送">
          <button class="btn btn-primary btn-sm" type="button" data-answer="${index}">发送回答</button>
        </div>` : `
        <div class="band-answer">
          <button class="btn btn-primary btn-sm" type="button" data-open-task="${index}">验收并合并</button>
          <button class="btn btn-sm" type="button" data-open-task="${index}">打回重做</button>
        </div>`}
      </div>
      <div class="band-item-side">
        <button class="btn btn-sm btn-quiet" type="button" data-open-task="${index}">详情</button>
      </div>
    </div>`;
  }

  /* ---------- H5 ---------- */
  function h5Card(task) {
    const index = TASKS.indexOf(task);
    const act = primaryAction(task);
    return `
    <article class="h5-card" data-tone="${task.tone}">
      <button class="h5-card-open" type="button" data-open-task="${index}" aria-label="打开「${esc(task.title)}」详情">
        <div class="h5-card-top">
          <h3 class="h5-card-title">${esc(task.title)}</h3>
          <span class="state" data-tone="${task.tone}">${esc(task.state)}</span>
        </div>
        <p class="h5-card-intent">${esc(task.intent)}</p>
        <div class="h5-card-meta">
          ${steps(task.substate)}
          <span class="chip chip-repo">${esc(task.repo)}</span>
          <span>${esc(task.prio)}</span>
          <span class="dot">·</span>
          <span>${esc(task.updated)}</span>
        </div>
      </button>
      <div class="h5-card-foot">
        ${act.label === '详情'
          ? `<button class="btn btn-primary" type="button" data-open-task="${index}">查看详情</button>`
          : `<button class="btn" type="button" data-open-task="${index}">详情</button>
             <button class="btn ${act.primary ? 'btn-primary' : ''}" type="button" data-action="${index}">${act.label}</button>`}
      </div>
    </article>`;
  }

  function h5Alert(task) {
    const index = TASKS.indexOf(task);
    const answer = task.substate === 'answer';
    return `
    <article class="h5-card h5-alert-card" data-tone="attention">
      <div class="h5-alert-head">
        <span class="h5-alert-kind">${esc(task.kind)}</span>
        <span class="h5-alert-src">${esc(task.title)} · ${esc(task.updated)}</span>
      </div>
      <p class="h5-alert-q">${esc(task.note ?? task.intent)}</p>
      ${answer ? `
      <div class="h5-answer">
        <label class="sr-only" for="h5-answer-${index}">回答</label>
        <textarea id="h5-answer-${index}" data-answer-input="${index}" placeholder="回答 worker 的提问"></textarea>
        <div class="row">
          <button class="btn" type="button" data-open-task="${index}">看详情</button>
          <button class="btn btn-primary" type="button" data-answer="${index}">发送回答</button>
        </div>
      </div>` : `
      <div class="h5-answer">
        <div class="row">
          <button class="btn" type="button" data-open-task="${index}">打回重做</button>
          <button class="btn btn-primary" type="button" data-open-task="${index}">验收通过</button>
        </div>
      </div>`}
    </article>`;
  }

  /* ---------- 渲染 ---------- */
  let offline = false;
  let onlyAttention = false;
  let h5Seg = 'running';

  function render() {
    const attention = byLane('attention');
    const todo = byLane('todo');
    const working = byLane('working');
    const done = byLane('done');

    $$('[data-sum="working"]').forEach((el) => { el.textContent = working.length; });
    $$('[data-sum="attention"]').forEach((el) => { el.textContent = attention.length; });
    $$('[data-sum="done"]').forEach((el) => { el.textContent = done.length; });
    $$('[data-attention-count]').forEach((el) => { el.textContent = attention.length; });
    $$('[data-attention-badge]').forEach((el) => { el.hidden = attention.length === 0; el.textContent = attention.length; });
    $$('[data-count="todo"]').forEach((el) => { el.textContent = todo.length; });
    $$('[data-count="working"]').forEach((el) => { el.textContent = working.length; });
    $$('[data-count="done"]').forEach((el) => { el.textContent = done.length; });
    $$('[data-h5-running]').forEach((el) => { el.textContent = todo.length + working.length; });

    $('[data-band]').dataset.empty = attention.length === 0 ? 'true' : 'false';
    $('[data-band-body]').innerHTML = attention.map(pcBandItem).join('');
    $('[data-lane="todo"]').innerHTML = todo.length ? todo.map(pcCard).join('') : '<div class="lane-empty">没有待指派的条目<br><button class="btn btn-sm" type="button" data-new>＋ 新建待办</button></div>';
    $('[data-lane="working"]').innerHTML = working.length ? working.map(pcCard).join('') : '<div class="lane-empty">执行器空闲，没有在跑的任务</div>';
    $('[data-lane="done"]').innerHTML = done.length ? done.map(pcCard).join('') : '<div class="lane-empty">最近 24 小时没有完成的任务</div>';
    $('.lanes').style.display = onlyAttention ? 'none' : '';
    renderActivity();
    renderH5();

    $$('[data-exec], [data-h5-conn]').forEach((el) => { el.dataset.state = offline ? 'off' : 'on'; });
    $$('[data-exec-title]').forEach((el) => { el.textContent = offline ? '执行器离线' : '执行器在线'; });
    $$('[data-exec-sub]').forEach((el) => { el.textContent = offline ? 'fetch failed' : '127.0.0.1:3092'; });
    $$('[data-h5-conn]').forEach((el) => { el.textContent = offline ? '离线' : '在线'; });
    $$('[data-offline]').forEach((el) => { el.dataset.on = offline ? 'true' : 'false'; });
    $$('[data-demo-offline]').forEach((el) => {
      el.setAttribute('aria-pressed', String(offline));
      $('[data-demo-label]', el).textContent = offline ? '演示：恢复在线' : '演示：模拟离线';
    });
  }

  function renderH5() {
    const body = $('[data-h5-body]');
    const attention = byLane('attention');
    const todo = byLane('todo');
    const working = byLane('working');
    const done = byLane('done');

    $$('[data-seg]').forEach((el) => {
      el.setAttribute('aria-selected', String(el.dataset.seg === h5Seg));
      if (el.dataset.seg === 'attention') el.dataset.alert = attention.length > 0 ? 'true' : 'false';
    });

    if (onlyAttention) {
      body.innerHTML = `<div class="h5-section-note">只看需要我 · ${attention.length} 条</div>` +
        (attention.length ? `<div class="h5-attention">${attention.map(h5Alert).join('')}</div>` : '<div class="h5-empty">没有需要你处理的事</div>');
      return;
    }

    if (h5Seg === 'activity') {
      const list = ACTIVITY.filter(actMatches);
      body.innerHTML = `
        <div class="h5-act-search">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--muted-2)" stroke-width="1.7"><circle cx="7" cy="7" r="4.4"/><path d="M10.3 10.3 14 14"/></svg>
          <input type="search" data-act-search value="${esc(actQuery)}" placeholder="搜标题、仓库、Ticket、事件" aria-label="搜索活动">
        </div>
        <div class="h5-act-chips">${ACT_FILTERS.map((filter) => `
          <button class="chip-filter" type="button" data-act-filter="${filter.id}" aria-pressed="${filter.id === actFilter}">${filter.label}</button>`).join('')}</div>
        ${list.length === 0 ? '<div class="h5-empty">没有匹配的活动</div>' : list.map((item, index) => {
          const task = TASKS[item.task];
          const prev = index === 0 ? undefined : list[index - 1];
          const dayHead = prev === undefined || prev.at.split(' ')[0] !== item.at.split(' ')[0]
            ? `<div class="h5-act-day">${esc(item.at.split(' ')[0])}</div>` : '';
          return `${dayHead}
            <button class="h5-act-row" type="button" data-act-open="${item.task}" aria-label="查看「${esc(task?.title ?? '')}」">
              <span class="act-time">${esc(item.at.split(' ')[1] ?? '')}</span>
              <span class="act-dot" data-kind="${item.kind}"></span>
              <span class="act-main">
                <span class="act-title">${highlight(task?.title ?? '（已删除的待办）')}</span>
                <span class="act-sub">${esc(item.label)} · ${highlight(item.text)} · ${esc(item.who)}</span>
              </span>
            </button>`;
        }).join('')}`;
      return;
    }

    if (h5Seg === 'attention') {
      body.innerHTML = attention.length
        ? `<div class="h5-attention">${attention.map(h5Alert).join('')}</div>`
        : '<div class="h5-empty">没有需要你处理的事。<br>执行器有进展或提问时会出现在这里。</div>';
      return;
    }

    if (h5Seg === 'running') {
      const cards = [...working, ...todo];
      body.innerHTML = `
        ${attention.length ? `<div class="h5-section-note">${attention.length} 条需要你处理 · <button class="link-btn" type="button" data-seg-jump="attention">去看看</button></div>` : ''}
        ${cards.length ? cards.map(h5Card).join('') : '<div class="h5-empty">执行器空闲，没有在跑的任务。<br>点右下角「＋」新建待办。</div>'}`;
      return;
    }

    body.innerHTML = done.length ? done.map(h5Card).join('') : '<div class="h5-empty">最近 24 小时没有完成的任务</div>';
  }

  /* ---------- 活动记录：来源是 events.jsonl + tasks.json ----------
     真实实现里事件流已经是 append-only 的事实源（task-create / task-assign /
     team-settle 等），这里按同形状演示，不做第二份真相。 */
  const ACTIVITY = [
    { at: '今天 14:02', kind: 'question', label: '提问', task: 0, text: '旧目录里还有 3 个未合并分支，删了就找不回来。', who: 'worker' },
    { at: '今天 13:48', kind: 'dispatch', label: '投递', task: 0, text: 'Source 扫描到待办，投递为 Trigger（attempt 1）', who: 'workmate' },

    { at: '今天 13:35', kind: 'review', label: '验收', task: 1, text: 'worker 报告完成：28 个任务全绿，6 条门禁通过', who: 'worker' },
    { at: '今天 13:12', kind: 'dispatch', label: '执行', task: 1, text: 'Ticket 9bdb818370e3 开始执行（person/review）', who: 'super-agent' },
    { at: '今天 12:50', kind: 'answer', label: '回答', task: 2, text: '人回答「用 main 作对照」，写入 inputs.jsonl seq=1', who: 'workmate:panel' },
    { at: '今天 12:31', kind: 'dispatch', label: '执行', task: 2, text: 'Ticket e12f44aa90cd 进入 working', who: 'super-agent' },

    { at: '今天 11:06', kind: 'end', label: '完成', task: 8, text: 'policy 分片补齐，真机 profile 验证通过', who: 'worker' },
    { at: '今天 10:22', kind: 'dispatch', label: '投递', task: 4, text: 'planHash 校验待办已投递，等待执行器接受', who: 'workmate' },
    { at: '今天 09:15', kind: 'accept', label: '创建', task: 5, text: '面板创建「补齐 README 接入步骤」，未指派', who: 'workmate:panel' },

    { at: '昨天 16:12', kind: 'stop', label: '停止', task: 9, text: 'worker 报 blocked：缺验收环境', who: 'worker' },
    { at: '昨天 14:05', kind: 'dispatch', label: '执行', task: 3, text: 'Ticket 77c2e9b311ab 排队，等待空闲 worker 槽', who: 'super-agent' },
  ];

  const ACT_FILTERS = [
    { id: 'all', label: '全部' },
    { id: 'question', label: '提问' },
    { id: 'review', label: '验收' },
    { id: 'end', label: '完成/停止' },
  ];

  let actFilter = 'all';
  let actQuery = '';

  const actMatches = (item) => {
    if (actFilter !== 'all') {
      const kind = item.kind;
      if (actFilter === 'end' ? !['end', 'stop'].includes(kind) : kind !== actFilter) return false;
    }
    if (actQuery === '') return true;
    const task = TASKS[item.task];
    const hay = [item.text, item.who, item.label, task?.title, task?.repo, task?.ticket?.id, task?.proposalId]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.includes(actQuery.toLowerCase());
  };

  const highlight = (text) => {
    if (actQuery === '') return esc(text);
    const index = text.toLowerCase().indexOf(actQuery.toLowerCase());
    if (index === -1) return esc(text);
    return `${esc(text.slice(0, index))}<mark>${esc(text.slice(index, index + actQuery.length))}</mark>${esc(text.slice(index + actQuery.length))}`;
  };

  function renderActivity() {
    $$('[data-act-chips]').forEach((host) => {
      host.innerHTML = ACT_FILTERS.map((filter) => `
        <button class="chip-filter" type="button" data-act-filter="${filter.id}" aria-pressed="${filter.id === actFilter}">${filter.label}</button>`).join('');
    });
    const list = ACTIVITY.filter(actMatches);
    $$('[data-act-total]').forEach((el) => { el.textContent = ACTIVITY.length; });
    $$('[data-act-shown]').forEach((el) => { el.textContent = list.length; });
    $$('[data-act-search]').forEach((input) => { if (input.value !== actQuery) input.value = actQuery; });
    const html = list.length === 0
      ? `<div class="act-empty">没有匹配的活动。<br>换个关键词，或清空筛选。</div>`
      : list.map((item, index) => {
          const task = TASKS[item.task];
          const prev = index === 0 ? undefined : list[index - 1];
          const dayHead = prev === undefined || prev.at.split(' ')[0] !== item.at.split(' ')[0]
            ? `<div class="act-day">${esc(item.at.split(' ')[0])}</div>` : '';
          const time = item.at.split(' ')[1] ?? '';
          return `${dayHead}
            <button class="act-row" type="button" data-act-open="${item.task}" aria-label="查看「${esc(task?.title ?? '')}」">
              <span class="act-time">${esc(time)}</span>
              <span class="act-dot" data-kind="${item.kind}"></span>
              <span class="act-main">
                <span class="act-title">${highlight(task?.title ?? '（已删除的待办）')}</span>
                <span class="act-sub">${highlight(item.text)} · ${esc(item.who)}${task?.ticket?.id ? ` · ${esc(task.ticket.id)}` : ''}</span>
              </span>
              <span class="act-kind">${esc(item.label)}</span>
            </button>`;
        }).join('');
    $$('[data-act-list]').forEach((host) => { host.innerHTML = html; });

  }

  /* ---------- 抽屉 ---------- */
  const stageIndexOf = (task) => {
    if (task.lane === 'todo') return 0;
    if (task.lane === 'done') return 4;
    if (['answer', 'review', 'blocked', 'failed', 'delivery'].includes(task.substate)) return 3;
    if (['submitted', 'not-scanning'].includes(task.substate)) return 1;
    return 2;
  };

  function openDrawer(index) {
    const task = TASKS[index];
    if (!task) return;
    const current = stageIndexOf(task);
    const track = STAGES.map((label, i) => `
      <div class="track-step" data-on="${i <= current}" data-current="${i === current}">
        <span class="track-dot"></span><span class="track-label">${label}</span>
      </div>${i < STAGES.length - 1 ? '<span class="track-line"></span>' : ''}`).join('');

    $('[data-drawer-eyebrow]').innerHTML = `
      <span class="state" data-tone="${task.tone}">${esc(task.state)}</span>
      <span class="chip chip-repo">${esc(task.repo)}</span>
      <span>${esc(task.prio)}</span>
      <span>· ${esc(task.updated)}</span>`;
    $('[data-drawer-title]').textContent = task.title;
    $('[data-drawer-sub]').textContent = task.intent;

    const attentionBlock = task.note && ['answer', 'blocked', 'failed', 'review', 'delivery'].includes(task.substate) ? `
      <div class="dsec">
        <h3 class="dsec-title">需要你处理</h3>
        <div class="notice"><b>${esc(task.kind ?? task.state)}</b><p>${esc(task.note)}</p></div>
        <div class="answer-box">
          <label class="sr-only" for="drawer-answer">${task.substate === 'answer' ? '回答' : '验收备注'}</label>
          <textarea id="drawer-answer" placeholder="${task.substate === 'answer'
            ? '回答会追加到 inputs.jsonl，同一 Thread 继续，不重新走评估'
            : '通过就点「验收通过」；有问题写在这里，worker 按备注改'}"></textarea>
          <div class="answer-actions">
            <span class="hint">${task.substate === 'answer' ? '回答不改变 Ticket 状态，只补充上下文' : '打回会把 Ticket 退回执行中'}</span>
            <span class="grow"></span>
            ${task.substate === 'answer'
              ? '<button class="btn btn-primary btn-sm" type="button">发送并继续</button>'
              : '<button class="btn btn-sm" type="button">打回重做</button><button class="btn btn-primary btn-sm" type="button">验收通过</button>'}
          </div>
        </div>
      </div>` : '';

    const execBlock = `
      <div class="dsec">
        <h3 class="dsec-title">执行 <span class="from">来自 Super-agent</span></h3>
        ${task.ticket ? `
        <dl class="kv">
          <dt>Ticket</dt><dd class="mono">${esc(task.ticket.id)}</dd>
          <dt>阶段</dt><dd>${esc(task.ticket.stage ?? '—')}${task.ticket.action ? ` · ${esc(task.ticket.action)}` : ''}${task.ticket.ended ? ` · ${esc(task.ticket.ended.outcome)}` : ''}</dd>
          <dt>目录</dt><dd class="mono">${esc(task.ticket.directory ?? '（尚未创建）')}</dd>
          <dt>尝试</dt><dd>第 ${task.attempt} 次</dd>
        </dl>` : `<div class="empty-line">还没有 Ticket。指派后由 Source 扫描投递；评估接受后才产生，期间面板显示「待接受」。</div>`}
      </div>`;

    const inputBlock = `
      <div class="dsec">
        <h3 class="dsec-title">输入 <span class="from">来自 WorkMate</span></h3>
        <dl class="kv">
          <dt>意图</dt><dd>${esc(task.intent)}</dd>
          <dt>基线</dt><dd class="mono">${esc(task.base)}</dd>
          <dt>创建者</dt><dd class="mono">${esc(task.createdBy)}</dd>
          ${task.proposalId ? `<dt>提案</dt><dd class="mono">${esc(task.proposalId)}</dd>` : ''}
          ${task.note && task.lane === 'done' ? `<dt>说明</dt><dd>${esc(task.note)}</dd>` : ''}
        </dl>
      </div>`;

    $('[data-drawer-body]').innerHTML = `
      <div class="dsec"><div class="track">${track}</div></div>
      ${attentionBlock}${execBlock}${inputBlock}`;

    // 抽屉里已经有回答/验收输入框，底部只放"离开视图"和破坏性动作；
    // 主按钮不再重复一遍"去回答"，避免两个入口语义重叠。
    $('[data-drawer-foot]').innerHTML = `
      <button class="btn btn-sm btn-danger" type="button">停止</button>

      <span class="grow"></span>
      <button class="btn btn-sm" type="button" data-drawer-close>关闭</button>`;

    $('[data-drawer]').dataset.open = 'true';
    $('[data-drawer]').setAttribute('aria-hidden', 'false');
    $('[data-mask]').dataset.open = 'true';
  }

  function closeDrawer() {
    $('[data-drawer]').dataset.open = 'false';
    $('[data-drawer]').setAttribute('aria-hidden', 'true');
    $('[data-mask]').dataset.open = 'false';
  }

  /* ---------- 新建 ---------- */
  function openModal() {
    $('[data-modal]').dataset.open = 'true';
    $('[data-modal]').setAttribute('aria-hidden', 'false');
    $('[data-modal-mask]').dataset.open = 'true';

  function closeModal() {

    $('[data-modal]').setAttribute('aria-hidden', 'true');
    $('[data-modal-mask]').dataset.open = 'false';
  }

  /* ---------- 回答 ---------- */
  function sendAnswer(index) {
    const inputs = $$(`[data-answer-input="${index}"]`);
    const filled = inputs.find((el) => el.value.trim() !== '');
    if (!filled) { inputs[0]?.focus(); return; }
    const task = TASKS[index];
    // 真机：POST /api/tasks/:id/reply 写入 inputs.jsonl，Source 下一轮扫描投递成 Trigger。
    task.lane = 'working'; task.substate = 'working'; task.state = '执行中'; task.tone = 'working';
    task.kind = '执行中'; task.note = undefined; task.updated = '刚刚';
    render();
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', (event) => {
    const el = event.target;
    const open = el.closest('[data-open-task]');
    if (open) { openDrawer(Number(open.dataset.openTask)); return; }
    const action = el.closest('[data-action]');
    if (action) {
      const index = Number(action.dataset.action);
      const task = TASKS[index];
      if (task && task.substate === 'unassigned') {
        task.lane = 'working'; task.substate = 'submitted'; task.state = '待接受'; task.kind = '待接受';
        task.tone = 'working'; task.attempt = 1; task.note = '已投递，等待执行器接受。'; task.updated = '刚刚';
        render();
        return;
      }
      openDrawer(index);
      return;
    }
    const answer = el.closest('[data-answer]');
    if (answer) { sendAnswer(Number(answer.dataset.answer)); return; }
    const nav = el.closest('[data-nav]');
    if (nav) { switchView(nav.dataset.nav); return; }
    const filter = el.closest('[data-act-filter]');
    if (filter) { actFilter = filter.dataset.actFilter; renderActivity(); return; }
    const actOpen = el.closest('[data-act-open]');
    if (actOpen) {
      const index = Number(actOpen.dataset.actOpen);
      if (TASKS[index]) openDrawer(index);
      return;
    }
    const tab = el.closest('[data-tab]');
    if (tab) { h5Seg = 'activity'; renderH5(); return; }
    const jump = el.closest('[data-seg-jump]');
    if (jump) { h5Seg = jump.dataset.segJump; renderH5(); return; }
    const seg = el.closest('[data-seg]');
    if (seg) { h5Seg = seg.dataset.seg; renderH5(); return; }
    if (el.closest('[data-new]')) { openModal(); return; }
    if (el.closest('[data-drawer-close]') || el.closest('[data-mask]')) { closeDrawer(); return; }
    if (el.closest('[data-modal-close]') || el.closest('[data-modal-cancel]') || el.closest('[data-modal-mask]')) { closeModal(); return; }
    if (el.closest('[data-reconnect]')) { offline = false; render(); return; }
    if (el.closest('[data-demo-offline]')) { offline = !offline; render(); return; }
    if (el.closest('[data-theme-toggle]')) {
      document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
      return;
    }
    if (el.closest('[data-device]')) {
      document.body.dataset.device = el.closest('[data-device]').dataset.device;
      render();
      return;
    }
    if (el.closest('[data-filter]')) {
      onlyAttention = !onlyAttention;
      $$('[data-filter]').forEach((btn) => {
        btn.setAttribute('aria-pressed', String(onlyAttention));
        const label = $('[data-filter-label]', btn);
        if (label) label.textContent = onlyAttention ? '显示全部' : '只看需要我';
      });
      $('.pc-main')?.scrollTo({ top: 0 });
      render();
      return;
    }
    const mode = el.closest('.mode');
    if (mode) {
      $$('.mode').forEach((other) => other.setAttribute('aria-pressed', 'false'));
      mode.setAttribute('aria-pressed', 'true');
      $('[data-modal-create]').textContent = $('b', mode).textContent === '仅记录' ? '仅创建' : '创建并指派';
      return;
    }
    if (el.closest('[data-modal-create]')) {
      const intent = $('#intent').value.trim();
      if (intent === '') { $('#intent').focus(); return; }
      const assigned = $('.mode[aria-pressed="true"] b').textContent !== '仅记录';
      TASKS.unshift({
        lane: assigned ? 'working' : 'todo',
        substate: assigned ? 'submitted' : 'unassigned',
        tone: assigned ? 'working' : 'todo',
        kind: assigned ? '待接受' : '未指派',
        state: assigned ? '待接受' : '未指派',
        title: intent.length > 40 ? intent.slice(0, 40) + '…' : intent,
        intent,
        ...(assigned ? { note: '已投递，等待执行器接受。' } : {}),
        repo: $('#repo').value, base: $('#base').value, prio: $('#prio').value, updated: '刚刚',
        createdBy: 'workmate:panel', attempt: assigned ? 1 : 0,
      });
      $('#intent').value = '';
      closeModal();
      render();
    }
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') { closeDrawer(); closeModal(); }
    if (event.key === 'Enter' && event.target.matches('[data-answer-input]') && !event.shiftKey) {
      event.preventDefault();
      sendAnswer(Number(event.target.dataset.answerInput));
    }
  });

  /* ---------- 视图切换 ---------- */
  let pcView = 'tasks';

  function switchView(view) {
    pcView = view;
    $$('[data-view]').forEach((el) => { el.hidden = el.dataset.view !== view; });
    $$('[data-nav]').forEach((el) => {
      if (el.dataset.nav === view) el.setAttribute('aria-current', 'page');
      else el.removeAttribute('aria-current');
    });
    if (view === 'activity') {
      $('.pc-main')?.scrollTo({ top: 0 });
      setTimeout(() => $('[data-view="activity"] [data-act-search]')?.focus({ preventScroll: true }), 60);
    }
  }

  // 搜索输入（PC 与 H5 各有一个，用事件委托保持同步）
  document.addEventListener('input', (event) => {
    const input = event.target.closest('[data-act-search]');
    if (!input) return;
    actQuery = input.value.trim();
    renderActivity();
    const again = $('[data-act-search]');
    if (again && again !== input) again.value = input.value;
  });

  document.addEventListener('keydown', (event) => {
    // 搜索框里回车 = 直接打开第一条匹配，不用再点一次
    if (event.key === 'Enter' && event.target.matches('[data-act-search]')) {
      const first = ACTIVITY.filter(actMatches)[0];
      if (first) { event.preventDefault(); openDrawer(first.task); }
      return;
    }
    // `/` 直接进活动并聚焦搜索；Esc 在该视图里清空
    if (event.key === '/' && !event.target.closest('input, textarea')) {
      event.preventDefault();
      switchView('activity');
      return;
    }
    if (event.key === 'Escape' && pcView === 'activity' && !event.target.closest('input')) {
      actQuery = '';
      renderActivity();
    }
  });

  document.body.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  render();
  switchView('tasks');
</script>
</body>
</html>
