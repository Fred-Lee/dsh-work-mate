name: toolchain

# WorkMate DSH toolchain version governance (openspec change adopt-workdsh-lessons,
# design.md D1 — pattern ported from the Helmsman line). Runs whenever the
# authoritative manifest, the package manifest, or this workflow changes, and
# fails the change when the committed state has drifted. Deliberately gates ONLY
# the toolchain surface — unrelated PRs are not affected.

on:
  push:
    paths:
      - 'toolchain.json'
      - 'package.json'
      - '.github/workflows/toolchain.yml'
  pull_request:
    paths:
      - 'toolchain.json'
      - 'package.json'
      - '.github/workflows/toolchain.yml'

permissions:
  contents: read

jobs:
  structural:
    name: Structural toolchain check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate toolchain.json against package.json
        run: node scripts/check-toolchain.mjs --structural
